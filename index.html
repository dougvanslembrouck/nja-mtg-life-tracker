<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>EDH Pod Life, Commander Damage & Analytics Tracker</title>
  <style>
    /* Global Reset & Mobile App Environment */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg-dark: #0b0d11;
      --border-dark: #1b1f2b;
      --text-muted: #79889b;
      --lethal-red: #f43f5e;
      --dead-grey: rgba(10, 11, 15, 0.9);
      --accent-blue: #3b82f6;
      --accent-green: #10b981;
      --accent-amber: #f59e0b;
    }

    body {
      background-color: var(--bg-dark);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #ffffff;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      position: fixed;
      user-select: none;
      -webkit-user-select: none;
    }

    /* Primary Application Screen Layout Matrices */
    .app-viewport {
      width: 100vw;
      height: 100vh;
      display: grid;
    }

    /* ===== POD MATRIX VIEWS ===== */
    .app-viewport.mode-4p {
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
    }
    .mode-4p #p1-container { grid-area: 1 / 1 / 2 / 2; transform: rotate(180deg); border-right: 1px solid var(--border-dark); border-bottom: 1px solid var(--border-dark); }
    .mode-4p #p2-container { grid-area: 1 / 2 / 2 / 3; transform: rotate(180deg); border-bottom: 1px solid var(--border-dark); }
    .mode-4p #p3-container { grid-area: 2 / 1 / 3 / 2; border-right: 1px solid var(--border-dark); }
    .mode-4p #p4-container { grid-area: 2 / 2 / 3 / 3; }

    .app-viewport.mode-3p {
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
    }
    .mode-3p #p1-container { grid-area: 1 / 1 / 2 / 2; transform: rotate(180deg); border-right: 1px solid var(--border-dark); border-bottom: 1px solid var(--border-dark); }
    .mode-3p #p2-container { grid-area: 1 / 2 / 2 / 3; transform: rotate(180deg); border-bottom: 1px solid var(--border-dark); }
    .mode-3p #p3-container { grid-area: 2 / 1 / 3 / 3; } 
    .mode-3p #p4-container { display: none !important; }

    .app-viewport.mode-2p {
      grid-template-columns: 1fr;
      grid-template-rows: 1fr 1fr;
    }
    .mode-2p #p1-container { grid-area: 1 / 1 / 2 / 2; transform: rotate(180deg); border-bottom: 1px solid var(--border-dark); }
    .mode-2p #p2-container { grid-area: 2 / 1 / 3 / 2; } 
    .mode-2p #p3-container { display: none !important; }
    .mode-2p #p4-container { display: none !important; }

    /* ===== PLAYER CARD UI COMPONENT ===== */
    .player-card {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 1rem;
      position: relative;
      transition: background-color 0.3s ease, opacity 0.4s ease;
      overflow: hidden;
    }

    /* Fantasy Element Theme Backdrops: land art under a tinted scrim for legibility.
       The color stays as a fallback if an image is missing. */
    .player-card[class*="theme-"] {
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }
    .theme-arcane {  /* Plains */
      background-color: #171228;
      background-image: linear-gradient(rgba(23, 18, 40, 0.55), rgba(10, 8, 20, 0.82)), url("plains.png");
    }
    .theme-inferno { /* Mountain */
      background-color: #240f0f;
      background-image: linear-gradient(rgba(36, 15, 15, 0.45), rgba(15, 6, 6, 0.8)), url("mountain.png");
    }
    .theme-forest {  /* Forest */
      background-color: #0c2014;
      background-image: linear-gradient(rgba(12, 32, 20, 0.45), rgba(5, 14, 8, 0.8)), url("forest-cropped.png");
    }
    .theme-shadow {  /* Swamp */
      background-color: #131518;
      background-image: linear-gradient(rgba(19, 21, 24, 0.4), rgba(8, 9, 11, 0.8)), url("swamp.png");
    }

    /* Keep text crisp on top of artwork */
    .life-val { text-shadow: 0 3px 18px rgba(0, 0, 0, 0.85), 0 1px 3px rgba(0, 0, 0, 0.9); }
    .player-name-input { text-shadow: 0 1px 4px rgba(0, 0, 0, 0.9); }
    .cmd-row { backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); }

    /* ===== COMMANDER ART BACKGROUNDS ===== */
    .theme-arcane  { --tint: 23, 18, 40; }
    .theme-inferno { --tint: 36, 15, 15; }
    .theme-forest  { --tint: 12, 32, 20; }
    .theme-shadow  { --tint: 19, 21, 24; }
    .player-card.has-art {
      background-image: linear-gradient(rgba(var(--tint), 0.45), rgba(8, 8, 12, 0.82)), var(--art);
    }

    .commander-line {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-top: 0.35rem;
      z-index: 5;
      min-width: 0;
    }
    .commander-pick-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      flex: 0 1 auto;
      min-width: 0;
      max-width: 100%;
      background: rgba(0, 0, 0, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.18);
      color: rgba(255, 255, 255, 0.85);
      font-size: 0.72rem;
      font-weight: 600;
      padding: 0.3rem 0.65rem;
      border-radius: 999px;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      -webkit-tap-highlight-color: transparent;
    }
    .commander-pick-btn .cp-label { overflow: hidden; text-overflow: ellipsis; }
    .commander-pick-btn .cp-caret { opacity: 0.6; flex-shrink: 0; }
    .art-credit {
      flex: 1 1 0;        /* only takes space the commander name leaves free */
      min-width: 0;
      font-size: 0.62rem;
      color: rgba(255, 255, 255, 0.55);
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .commander-picker {
      position: absolute;
      inset: 0;
      z-index: 50;
      background: rgba(9, 10, 14, 0.96);
      display: none;
      flex-direction: column;
      padding: 0.85rem;
      gap: 0.6rem;
    }
    .commander-picker.open { display: flex; }
    .picker-top { display: flex; gap: 0.5rem; }
    .picker-search {
      flex: 1;
      min-width: 0;
      background: #171a23;
      border: 1px solid #2a3142;
      color: #fff;
      font-size: 1rem;
      padding: 0.6rem 0.8rem;
      border-radius: 10px;
      outline: none;
    }
    .picker-search:focus { border-color: var(--accent-blue); }
    .picker-close {
      background: #fff;
      color: #000;
      border: none;
      font-weight: 700;
      font-size: 0.75rem;
      text-transform: uppercase;
      padding: 0 0.9rem;
      border-radius: 10px;
      cursor: pointer;
    }
    .picker-results {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      -webkit-overflow-scrolling: touch;
    }
    .picker-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      text-align: left;
      background: #141822;
      border: 1px solid transparent;
      color: #fff;
      font-size: 0.88rem;
      padding: 0.6rem 0.75rem;
      border-radius: 8px;
      cursor: pointer;
    }
    .picker-item:active, .picker-item.selected { border-color: var(--accent-blue); }
    .picker-item.land-option { color: var(--text-muted); font-style: italic; }
    .picker-hint { color: var(--text-muted); font-size: 0.8rem; text-align: center; padding: 0.75rem 0; }
    .pips { display: inline-flex; gap: 3px; flex-shrink: 0; }
    .pip { width: 10px; height: 10px; border-radius: 50%; border: 1px solid rgba(0,0,0,0.5); }
    .pip-W { background: #f8f1d4; } .pip-U { background: #4a90d9; } .pip-B { background: #6b5b73; }
    .pip-R { background: #e0533d; } .pip-G { background: #3f9e5a; } .pip-C { background: #b9b4ae; }
    .log-commander { color: var(--text-muted); font-size: 0.75rem; font-weight: 400; }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 5;
    }

    .player-name-input {
      background: transparent;
      border: none;
      color: rgba(255, 255, 255, 0.65);
      font-size: 1.1rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      outline: none;
      width: 50%;
      border-bottom: 1px solid transparent;
    }
    .player-name-input:focus {
      color: #ffffff;
      border-bottom-color: rgba(255, 255, 255, 0.3);
    }

    .dead-btn {
      background: rgba(244, 63, 94, 0.15);
      border: 1px solid rgba(244, 63, 94, 0.4);
      color: #f43f5e;
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      padding: 0.35rem 0.75rem;
      border-radius: 4px;
      cursor: pointer;
      z-index: 10;
    }

    .life-engine {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      margin: auto 0;
      padding: 0.25rem 0;
    }

    .life-val {
      font-size: 5rem;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      text-align: center;
      flex: 1;
    }

    /* Enlarged and optimized touch buttons */
    .life-btn {
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #ffffff;
      width: 78px;
      height: 78px;
      border-radius: 50%;
      font-size: 2.5rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.05s, background-color 0.1s;
      -webkit-tap-highlight-color: transparent;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.3);
      flex-shrink: 0;
    }
    .life-btn:active { transform: scale(0.92); background-color: rgba(255, 255, 255, 0.3); }

    .commander-panel {
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding-top: 0.5rem;
      margin-top: 0.25rem;
    }

    .panel-title {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      margin-bottom: 0.4rem;
      font-weight: 700;
    }

    .commander-grid-scroller { display: flex; flex-direction: column; gap: 0.35rem; }

    .cmd-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(0, 0, 0, 0.4);
      padding: 0.35rem 0.75rem;
      border-radius: 6px;
      border-left: 4px solid transparent;
    }

    /* Individual Element Accent Indicators on Rows */
    .cmd-row.target-p1 { border-left-color: #a78bfa; } /* Arcane Purple */
    .cmd-row.target-p2 { border-left-color: #ef4444; } /* Inferno Red */
    .cmd-row.target-p3 { border-left-color: #10b981; } /* Forest Green */
    .cmd-row.target-p4 { border-left-color: #64748b; } /* Shadow Grey */

    .cmd-label { font-size: 0.8rem; font-weight: 600; color: rgba(255, 255, 255, 0.8); }
    .cmd-controls { display: flex; align-items: center; gap: 0.65rem; }

    .cmd-sub-btn {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.05);
      color: #fff;
      font-weight: bold;
      font-size: 0.9rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .cmd-damage-val { font-family: monospace; font-size: 1rem; font-weight: 700; min-width: 1.25rem; text-align: center; }

    .cmd-row.lethal-warning { background-color: rgba(244, 63, 94, 0.25); border-color: var(--lethal-red); }
    .cmd-row.lethal-warning .cmd-damage-val { color: var(--lethal-red); animation: heartBeat 1.5s infinite; }

    .player-card.is-eliminated { background-color: var(--dead-grey) !important; opacity: 0.35; filter: grayscale(1); }
    .player-card.is-eliminated .life-btn,
    .player-card.is-eliminated .cmd-sub-btn,
    .player-card.is-eliminated .player-name-input { pointer-events: none; opacity: 0.2; }
    /* ===== MONARCH ===== */
    .header-actions { display: flex; align-items: center; gap: 0.45rem; }
    .monarch-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 34px;
      height: 28px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(0, 0, 0, 0.35);
      color: rgba(255, 255, 255, 0.45);
      cursor: pointer;
      z-index: 10;
      -webkit-tap-highlight-color: transparent;
      transition: background-color 0.2s, color 0.2s, box-shadow 0.2s;
    }
    .monarch-btn svg { width: 18px; height: 18px; }
    .player-card.is-monarch .monarch-btn {
      color: #1a1404;
      background: #f5c542;
      border-color: #ffe08a;
      box-shadow: 0 0 14px rgba(245, 197, 66, 0.7);
    }
    .player-card.is-monarch {
      box-shadow: inset 0 0 0 3px rgba(245, 197, 66, 0.9), inset 0 0 48px rgba(245, 197, 66, 0.25);
    }
    .player-card.is-eliminated .monarch-btn { pointer-events: none; opacity: 0.2; }
    .log-monarch { color: #f5c542; font-size: 0.75rem; }

    /* ===== COMMANDER TAX ===== */
    .tax-control {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      flex-shrink: 0;
      margin-left: auto;
      background: rgba(0, 0, 0, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 999px;
      padding: 0.15rem 0.2rem;
    }
    .tax-label {
      font-size: 0.6rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-muted);
      padding-left: 0.2rem;
    }
    .tax-val {
      font-family: monospace;
      font-size: 0.95rem;
      font-weight: 700;
      min-width: 1.1rem;
      text-align: center;
      color: rgba(255, 255, 255, 0.85);
    }
    .tax-control.has-tax { border-color: rgba(245, 158, 11, 0.55); }
    .tax-control.has-tax .tax-val { color: var(--accent-amber); }
    .tax-btn {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.06);
      color: #fff;
      font-weight: 700;
      font-size: 0.85rem;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-tap-highlight-color: transparent;
    }
    .tax-btn:active { background: rgba(255, 255, 255, 0.25); }
    .player-card.is-eliminated .tax-btn { pointer-events: none; opacity: 0.2; }
    .log-tax { color: var(--accent-amber); font-size: 0.72rem; font-weight: 400; }

    /* Narrow cards (phone in 4P): commander button gets its own row, tax drops below it */
    .player-card { container-type: inline-size; }
    @container (max-width: 300px) {
      .commander-line { flex-wrap: wrap; row-gap: 0.35rem; }
      .commander-pick-btn { flex: 1 1 100%; justify-content: space-between; }
      .art-credit { display: none; }
      .tax-control { margin-left: 0; }
    }

    .player-card.is-eliminated .dead-btn { background: rgba(255, 255, 255, 0.1); border-color: rgba(255, 255, 255, 0.3); color: #ffffff; }

    /* ===== INTERACTIVE CONTROL OVERLAYS & HUD SYSTEM ===== */
    .hud-controller-bar {
      position: absolute;
      bottom: 1rem;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 18, 25, 0.92);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-dark);
      padding: 0.4rem 0.8rem;
      border-radius: 30px;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      z-index: 100;
      box-shadow: 0 8px 32px rgba(0,0,0,0.6);
      max-width: 95vw;
    }

    .hud-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 0.5rem 0.85rem;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .hud-btn.active { background: rgba(255, 255, 255, 0.1); color: #ffffff; }
    .hud-btn.btn-action { color: var(--accent-green); border: 1px solid rgba(16, 185, 129, 0.3); }
    .hud-btn.btn-reset { color: var(--accent-amber); border: 1px solid rgba(245, 158, 11, 0.3); }
    .hud-btn.btn-log { color: var(--accent-blue); border: 1px solid rgba(59, 130, 246, 0.3); }

    .hud-divider {
      width: 1px;
      height: 20px;
      background: var(--border-dark);
      margin: 0 0.15rem;
    }

    /* ===== GAME LOG DATA SLIDE PANELS ===== */
    .history-panel {
      position: absolute;
      bottom: -100%;
      left: 0;
      width: 100vw;
      height: 80vh;
      background: #0f121a;
      border-top: 2px solid var(--border-dark);
      border-radius: 24px 24px 0 0;
      z-index: 500;
      transition: bottom 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      flex-direction: column;
      box-shadow: 0 -12px 40px rgba(0,0,0,0.7);
    }
    .history-panel.open { bottom: 0; }

    .panel-header {
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid var(--border-dark);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .panel-header h2 { font-size: 1.2rem; font-weight: 800; letter-spacing: 0.02em; }
    
    .panel-actions { display: flex; gap: 0.6rem; }
    .action-btn {
      background: #171a23;
      border: 1px solid var(--border-dark);
      color: #ffffff;
      padding: 0.45rem 0.9rem;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      border-radius: 6px;
      cursor: pointer;
    }
    .action-btn.danger { color: var(--lethal-red); border-color: rgba(244, 63, 94, 0.3); }
    .action-btn.close-btn { background: #fff; color: #000; border: none; font-size: 0.8rem; padding: 0.45rem 1.2rem; border-radius: 20px;}

    .history-stream {
      flex: 1;
      overflow-y: auto;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .empty-state {
      color: var(--text-muted);
      text-align: center;
      margin: auto;
      font-size: 0.9rem;
    }

    .log-card {
      background: #141822;
      border: 1px solid var(--border-dark);
      border-radius: 12px;
      padding: 1rem;
    }
    .log-meta {
      display: flex;
      justify-content: space-between;
      font-size: 0.7rem;
      color: var(--text-muted);
      text-transform: uppercase;
      font-weight: 700;
      margin-bottom: 0.6rem;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      padding-bottom: 0.4rem;
    }
    .log-lineup { display: flex; flex-direction: column; gap: 0.35rem; }
    .log-row-player { display: flex; justify-content: space-between; font-size: 0.88rem; }
    .log-row-player.winner { color: var(--accent-green); font-weight: 700; }
    .log-row-player.dead { color: rgba(255,255,255,0.4); text-decoration: line-through; }

    /* Hidden Utility Node */
    #import-hook { display: none; }

    @keyframes heartBeat {
      0% { transform: scale(1); }
      14% { transform: scale(1.1); }
      28% { transform: scale(1); }
      42% { transform: scale(1.1); }
      70% { transform: scale(1); }
    }
  </style>
</head>
<body>

  <!-- Game Setup Viewport Wrapper -->
  <div class="app-viewport mode-4p" id="viewport">

    <!-- PLAYER 1 CORE CARD (ARCANE) -->
    <div class="player-card theme-arcane" id="p1-container" data-player-id="1">
      <div class="card-header">
        <input type="text" class="player-name-input" value="Arcane" data-p-id="1" />
        <button class="dead-btn" onclick="togglePlayerDeath(1)">I'm Dead</button>
      </div>
      <div class="life-engine">
        <button class="life-btn" onclick="modifyLife(1, -1)">—</button>
        <span class="life-val" id="p1-life">40</span>
        <button class="life-btn" onclick="modifyLife(1, 1)">+</button>
      </div>
      <div class="commander-panel">
        <div class="panel-title">Commander Damage Received</div>
        <div class="commander-grid-scroller">
          <div class="cmd-row target-p2" id="p1-from-p2" data-opponent-id="2"><span class="cmd-label" data-label-id="2">Inferno</span><div class="cmd-controls"><button class="cmd-sub-btn" onclick="modifyCmdDamage(1, 2, -1)">-</button><span class="cmd-damage-val">0</span><button class="cmd-sub-btn" onclick="modifyCmdDamage(1, 2, 1)">+</button></div></div>
          <div class="cmd-row target-p3" id="p1-from-p3" data-opponent-id="3"><span class="cmd-label" data-label-id="3">Forest</span><div class="cmd-controls"><button class="cmd-sub-btn" onclick="modifyCmdDamage(1, 3, -1)">-</button><span class="cmd-damage-val">0</span><button class="cmd-sub-btn" onclick="modifyCmdDamage(1, 3, 1)">+</button></div></div>

  </div>

  <!-- CONTROL LAYER HUD -->
  <div class="hud-controller-bar">
    <button class="hud-btn" id="btn-set-2p" onclick="setLayoutMode('mode-2p')">2P</button>
    <button class="hud-btn" id="btn-set-3p" onclick="setLayoutMode('mode-3p')">3P</button>
    <button class="hud-btn active" id="btn-set-4p" onclick="setLayoutMode('mode-4p')">4P</button>
    <div class="hud-divider"></div>
    <button class="hud-btn btn-reset" onclick="resetGame()">Reset</button>
    <button class="hud-btn btn-action" onclick="commitCurrentGameLog()">Log Game</button>
    <button class="hud-btn btn-log" onclick="openHistoryPanel()">History</button>
  </div>

  <!-- HISTORICAL DATA METRICS ENGINE VIEW -->
  <div class="history-panel" id="history-panel">
    <div class="panel-header">
      <h2>Match History Logs</h2>
      <div class="panel-actions">
        <button class="action-btn" onclick="exportLogDatabase()">Export JSON</button>
        <button class="action-btn" onclick="triggerImportSelection()">Import JSON</button>
        <button class="action-btn danger" onclick="clearLogDatabase()">Clear All</button>
        <button class="action-btn close-btn" onclick="closeHistoryPanel()">Close</button>
      </div>
    </div>
    <div class="history-stream" id="history-stream">
      <!-- Generated Log Nodes Map Internally Here -->
    </div>
  </div>

  <!-- Invisible system handling node targeting system local storage uploads -->
  <input type="file" id="import-hook" accept=".json" onchange="importLogDatabase(event)" />

  <!-- Bundled commander list (regenerate with tools/update-commanders.html) -->
  <script src="commanders.js"></script>
  <script>
    // System Active Global States
    let activeLayoutMode = 'mode-4p';
    const playerLifeState = { 1: 40, 2: 40, 3: 40, 4: 40 };
    const playerDeadState = { 1: false, 2: false, 3: false, 4: false };
    
    const cmdDamageState = {
      1: { 2: 0, 3: 0, 4: 0 },
      2: { 1: 0, 3: 0, 4: 0 },
      3: { 1: 0, 2: 0, 4: 0 },
      4: { 1: 0, 2: 0, 3: 0 }
    };

    // Database Initialization
    let matchesDatabase = JSON.parse(localStorage.getItem('edh_match_history')) || [];

    function modifyLife(playerId, delta) {
      if (playerDeadState[playerId]) return;
      playerLifeState[playerId] += delta;
      document.getElementById(`p${playerId}-life`).textContent = playerLifeState[playerId];
    }

    function modifyCmdDamage(defenderId, attackerId, delta) {
      if (playerDeadState[defenderId]) return;
      let currentDmg = cmdDamageState[defenderId][attackerId];
      let targetNewDmg = currentDmg + delta;

      if (targetNewDmg < 0) return;

      cmdDamageState[defenderId][attackerId] = targetNewDmg;
      modifyLife(defenderId, -delta);

      const targetRowElement = document.getElementById(`p${defenderId}-from-p${attackerId}`);
      targetRowElement.querySelector('.cmd-damage-val').textContent = targetNewDmg;

      if (targetNewDmg >= 21) {
        targetRowElement.classList.add('lethal-warning');
      } else {
        targetRowElement.classList.remove('lethal-warning');
      }
    }

    // Commander tax: {2} more each time a commander is cast from the command zone
    const TAX_STEP = 2;
    const playerTaxState = { 1: 0, 2: 0, 3: 0, 4: 0 };

    function renderTax(playerId) {
      const control = document.querySelector(`#p${playerId}-container .tax-control`);
      if (!control) return;
      const tax = playerTaxState[playerId];
      control.querySelector('.tax-val').textContent = tax;
      control.classList.toggle('has-tax', tax > 0);
      control.title = tax ? `Commander cast ${tax / TAX_STEP + 1} times. Next cast costs {${tax}} more.` : 'No commander tax yet';
    }

    function modifyTax(playerId, direction) {
      if (playerDeadState[playerId]) return;
      playerTaxState[playerId] = Math.max(0, playerTaxState[playerId] + direction * TAX_STEP);
      renderTax(playerId);
    }

    // Only one player can be the monarch at a time (null = nobody)
    let monarchPlayerId = null;

    function setMonarch(playerId) {
      monarchPlayerId = playerId;
      for (let i = 1; i <= 4; i++) {
        const cardNode = document.getElementById(`p${i}-container`);
        const isMonarch = i === playerId;
        cardNode.classList.toggle('is-monarch', isMonarch);
        const btn = cardNode.querySelector('.monarch-btn');
        btn.setAttribute('aria-pressed', isMonarch ? 'true' : 'false');
        btn.title = isMonarch ? 'Monarch (tap to remove)' : 'Make monarch';
      }
    }

    function toggleMonarch(playerId) {
      if (playerDeadState[playerId]) return;
      setMonarch(monarchPlayerId === playerId ? null : playerId);
    }

    function togglePlayerDeath(playerId) {
      const cardNode = document.getElementById(`p${playerId}-container`);
      const buttonNode = cardNode.querySelector('.dead-btn');
      
      playerDeadState[playerId] = !playerDeadState[playerId];
      
      if (playerDeadState[playerId]) {
        cardNode.classList.add('is-eliminated');
        buttonNode.textContent = "Undo";
        // The crown passes on when the monarch leaves the game; tap it onto the new monarch
        if (monarchPlayerId === playerId) setMonarch(null);
      } else {
        cardNode.classList.remove('is-eliminated');
        buttonNode.textContent = "I'm Dead";
      }
    }

    function resetGame() {
      if (!confirm("Reset game? All player life totals and commander damage will start over.")) {
        return;
      }

      setMonarch(null);

      for (let i = 1; i <= 4; i++) {
        // Reset Commander Tax
        playerTaxState[i] = 0;
        renderTax(i);

        // Reset Life
        playerLifeState[i] = 40;
        document.getElementById(`p${i}-life`).textContent = 40;

        // Reset Death Status
        playerDeadState[i] = false;
        const cardNode = document.getElementById(`p${i}-container`);
        cardNode.classList.remove('is-eliminated');
        cardNode.querySelector('.dead-btn').textContent = "I'm Dead";

        // Reset Commander Damage Received
        for (let j = 1; j <= 4; j++) {
          if (i !== j) {
            cmdDamageState[i][j] = 0;
            const row = document.getElementById(`p${i}-from-p${j}`);
            if (row) {
              row.querySelector('.cmd-damage-val').textContent = 0;
              row.classList.remove('lethal-warning');
            }
          }
        }
      }
    }

    function setLayoutMode(selectedModeClass) {
      activeLayoutMode = selectedModeClass;
      const viewNode = document.getElementById('viewport');
      
      document.getElementById('btn-set-2p').classList.remove('active');
      document.getElementById('btn-set-3p').classList.remove('active');
      document.getElementById('btn-set-4p').classList.remove('active');

      if (selectedModeClass === 'mode-2p') {
        viewNode.className = 'app-viewport mode-2p';
        document.getElementById('btn-set-2p').classList.add('active');
        showActiveCommanderRows([1, 2]);
      } else if (selectedModeClass === 'mode-3p') {
        viewNode.className = 'app-viewport mode-3p';
        document.getElementById('btn-set-3p').classList.add('active');
        showActiveCommanderRows([1, 2, 3]);
      } else {
        viewNode.className = 'app-viewport mode-4p';
        document.getElementById('btn-set-4p').classList.add('active');
        showActiveCommanderRows([1, 2, 3, 4]);
      }

      const seatCount = selectedModeClass === 'mode-2p' ? 2 : selectedModeClass === 'mode-3p' ? 3 : 4;
      if (monarchPlayerId && monarchPlayerId > seatCount) setMonarch(null);
    }

    function showActiveCommanderRows(activePlayerIds) {
      document.querySelectorAll('.cmd-row').forEach(row => {
        const opponentId = parseInt(row.getAttribute('data-opponent-id'), 10);
        if (activePlayerIds.includes(opponentId)) {
          row.style.display = 'flex';
        } else {
          row.style.display = 'none';
        }
      });
    }

    /* ===== GAME LOGS METRICS ENGINE PLATFORM SOURCE ===== */
    
    function commitCurrentGameLog() {
      let activeCount = activeLayoutMode === 'mode-2p' ? 2 : activeLayoutMode === 'mode-3p' ? 3 : 4;
      let playerPerformanceArray = [];
      
      for(let i = 1; i <= activeCount; i++) {
        let defaultFallback = i === 1 ? "Arcane" : i === 2 ? "Inferno" : i === 3 ? "Forest" : "Shadow";
        let pName = document.querySelector(`[data-p-id="${i}"]`).value.trim() || defaultFallback;
        playerPerformanceArray.push({
          id: i,
          name: pName,
          lifeLeft: playerLifeState[i],
          isDead: playerDeadState[i],
          isMonarch: monarchPlayerId === i,
          commanderTax: playerTaxState[i],
          commander: playerCommander[i] ? playerCommander[i][0] : null
        });
      }

      let livePlayers = playerPerformanceArray.filter(p => !p.isDead);
      let absoluteWinners = [];
      
      if(livePlayers.length === 1) {
        absoluteWinners.push(livePlayers[0].id);
      } else {
        let maxLife = Math.max(...playerPerformanceArray.map(p => p.lifeLeft));
        playerPerformanceArray.forEach(p => {
          if(!p.isDead && p.lifeLeft === maxLife) absoluteWinners.push(p.id);
        });
      }

      const freshMatchRecord = {
        id: 'match_' + Date.now(),
        timestamp: new Date().toLocaleString(),
        mode: activeCount + ' Players',
        players: playerPerformanceArray,
        winners: absoluteWinners
      };

      matchesDatabase.unshift(freshMatchRecord);
      saveDatabaseState();
      alert("Game successfully logged to database!");
    }

    function saveDatabaseState() {
      localStorage.setItem('edh_match_history', JSON.stringify(matchesDatabase));
    }

    function renderLogsToViewport() {
      const streamContainer = document.getElementById('history-stream');
      streamContainer.innerHTML = '';

      if (matchesDatabase.length === 0) {
        streamContainer.innerHTML = '<div class="empty-state">No recorded match data found locally.</div>';
        return;
      }

      matchesDatabase.forEach(match => {
        let cardElement = document.createElement('div');
        cardElement.className = 'log-card';
        
        let metaLine = `<div class="log-meta"><span>${escapeHtml(match.mode)}</span><span>${escapeHtml(match.timestamp)}</span></div>`;
        let lineageHtml = `<div class="log-lineup">`;

        match.players.forEach(p => {
          let statusClass = match.winners.includes(p.id) ? 'winner' : p.isDead ? 'dead' : '';
          let statusText = match.winners.includes(p.id) ? '🏆 WIN' : p.isDead ? 'ELIMINATED' : `${p.lifeLeft} HP`;
          
          lineageHtml += `
            <div class="log-row-player ${statusClass}">
              <span>${p.isMonarch ? '<span class="log-monarch" title="Monarch">♛</span> ' : ''}${escapeHtml(p.name)}${p.commander ? ` <span class="log-commander">· ${escapeHtml(p.commander)}</span>` : ''}${p.commanderTax ? ` <span class="log-tax">· tax ${p.commanderTax}</span>` : ''}</span>
              <span>${statusText}</span>
            </div>`;
        });

        lineageHtml += `</div>`;
        cardElement.innerHTML = metaLine + lineageHtml;
        streamContainer.appendChild(cardElement);
      });
    }

    // Modal Control Handles
    function openHistoryPanel() {
      renderLogsToViewport();
      document.getElementById('history-panel').classList.add('open');
    }

    function closeHistoryPanel() {
      document.getElementById('history-panel').classList.remove('open');
    }

    function exportLogDatabase() {
      if (matchesDatabase.length === 0) {
        alert("The history sheet data frame profile target contains zero logs.");
        return;
      }
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(matchesDatabase, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `edh_match_history_${Date.now()}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    function triggerImportSelection() {
      document.getElementById('import-hook').click();
    }

    function importLogDatabase(event) {
      const selectedFile = event.target.files[0];
      if (!selectedFile) return;

      const fileReader = new FileReader();
      fileReader.onload = function(e) {
        try {
          const parsedData = JSON.parse(e.target.result);
          if (Array.isArray(parsedData)) {
            matchesDatabase = parsedData.concat(matchesDatabase);
            saveDatabaseState();
            renderLogsToViewport();
            alert("Match database logs successfully imported!");
          } else {
            alert("Error: File shape template structural format mismatch.");
          }
        } catch (err) {
          alert("Error parsing file structure. Verify target JSON consistency.");
        }
      };
      fileReader.readAsText(selectedFile);
      event.target.value = ''; // Reset file input
    }

    function clearLogDatabase() {
      if (confirm("Are you completely sure you want to permanently erase ALL history logs?")) {
        matchesDatabase = [];
        saveDatabaseState();
        renderLogsToViewport();
      }
    }

    // Dynamic Binding Observers to map inputted metadata across subcomponents
    document.querySelectorAll('.player-name-input').forEach(inputField => {
      inputField.addEventListener('input', (e) => {
        const id = e.target.getAttribute('data-p-id');
        const defaultFallback = id === "1" ? "Arcane" : id === "2" ? "Inferno" : id === "3" ? "Forest" : "Shadow";
        const assignedName = e.target.value.trim() || defaultFallback;
        
        document.querySelectorAll(`[data-label-id="${id}"]`).forEach(label => {
          label.textContent = assignedName;
        });
      });
    });

    /* ===== MONARCH TOGGLES ===== */
    const CROWN_SVG = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 7l4.5 4L12 4l4.5 7L21 7l-2 11H5L3 7zm2 13h14v2H5v-2z"/></svg>';
    for (let id = 1; id <= 4; id++) {
      const header = document.querySelector(`#p${id}-container .card-header`);
      const deadBtn = header.querySelector('.dead-btn');
      const actions = document.createElement('div');
      actions.className = 'header-actions';
      const crown = document.createElement('button');
      crown.className = 'monarch-btn';
      crown.type = 'button';
      crown.innerHTML = CROWN_SVG;
      crown.setAttribute('aria-label', 'Monarch');
      crown.addEventListener('click', () => toggleMonarch(id));
      header.insertBefore(actions, deadBtn);
      actions.append(crown, deadBtn);
    }
    setMonarch(null);

    /* ===== COMMANDER ART PICKER ===== */

    // playerCommander[id] = [name, scryfallId, artist, colorIdentity] or null (land background)
    const playerCommander = { 1: null, 2: null, 3: null, 4: null };
    const COMMANDER_STORE_KEY = 'edh_player_commanders';
    const COMMANDER_LIST = (window.COMMANDERS && Array.isArray(window.COMMANDERS.cards)) ? window.COMMANDERS.cards : [];
    const MAX_RESULTS = 40;

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, ch => (
        { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]
      ));
    }

    function normalizeText(text) {
      return text.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '')
        .replace(/['’]/g, '')          // T'Challa -> tchalla, Sauron's -> saurons
        .replace(/[^a-z0-9 ]+/g, ' ').replace(/\s+/g, ' ').trim();
    }

    // Search index: every word of the name, so "panther" or "black pan" both find T'Challa
    const commanderIndex = COMMANDER_LIST.map(card => {
      const norm = normalizeText(card[0]);
      return { card, norm, words: norm.split(' ') };
    });
    const commanderByName = new Map(COMMANDER_LIST.map(card => [card[0], card]));

    function searchCommanders(query) {
      const q = normalizeText(query);
      if (!q) return [];
      const terms = q.split(' ');
      const hits = [];
      for (const entry of commanderIndex) {
        // Every typed word must be the start of some word in the name (no mid-word matches)
        if (!terms.every(t => entry.words.some(w => w.startsWith(t)))) continue;
        const rank = entry.norm.startsWith(q) ? 0 : 1;
        hits.push({ entry, rank });
      }
      hits.sort((a, b) => a.rank - b.rank || a.entry.norm.localeCompare(b.entry.norm));
      return hits.map(h => h.entry.card);
    }

    function artCropUrl(scryfallId) {
      return `https://cards.scryfall.io/art_crop/front/${scryfallId[0]}/${scryfallId[1]}/${scryfallId}.jpg`;
    }

    function pipsHtml(colorIdentity) {
      const colors = colorIdentity ? colorIdentity.split('') : ['C'];
      return `<span class="pips">${colors.map(c => `<span class="pip pip-${c}"></span>`).join('')}</span>`;
    }

    function saveCommanderChoices() {
      try {
        const names = {};
        for (const id in playerCommander) names[id] = playerCommander[id] ? playerCommander[id][0] : null;
        localStorage.setItem(COMMANDER_STORE_KEY, JSON.stringify(names));
      } catch (e) { /* storage unavailable; choices just won't persist */ }
    }

    function setPlayerCommander(playerId, card) {
      const cardNode = document.getElementById(`p${playerId}-container`);
      const label = cardNode.querySelector('.commander-pick-btn .cp-label');
      const credit = cardNode.querySelector('.art-credit');
      playerCommander[playerId] = card || null;

      if (!card) {
        cardNode.classList.remove('has-art');
        cardNode.style.removeProperty('--art');
        label.textContent = 'Choose commander';
        credit.textContent = '';
        saveCommanderChoices();
        return;
      }

      label.textContent = card[0];
      credit.textContent = card[2] ? `Art: ${card[2]}` : '';
      const url = artCropUrl(card[1]);
      const probe = new Image();
      probe.onload = () => {
        if (playerCommander[playerId] !== card) return; // a newer pick won
        cardNode.style.setProperty('--art', `url("${url}")`);
        cardNode.classList.add('has-art');
      };
      probe.onerror = () => {
        // Offline or image missing: keep the land background, keep the commander name
        if (playerCommander[playerId] !== card) return;
        cardNode.classList.remove('has-art');
        credit.textContent = 'Art unavailable offline';
      };
      probe.src = url;
      saveCommanderChoices();
    }

    function renderPickerResults(playerId) {
      const picker = document.getElementById(`p${playerId}-picker`);
      const query = picker.querySelector('.picker-search').value;
      const list = picker.querySelector('.picker-results');
      const current = playerCommander[playerId];
      let html = `<button class="picker-item land-option" data-pick="">Use land background</button>`;

      if (!COMMANDER_LIST.length) {
        list.innerHTML = html + `<div class="picker-hint">Commander list not found. Make sure commanders.js is next to index.html.</div>`;
        return;
      }
      if (!normalizeText(query)) {
        list.innerHTML = html + `<div class="picker-hint">Start typing a commander's name<br>${COMMANDER_LIST.length.toLocaleString()} commanders · updated ${escapeHtml(window.COMMANDERS.updated || '')}</div>`;
        return;
      }

      const results = searchCommanders(query);
      html += results.slice(0, MAX_RESULTS).map(card => `
        <button class="picker-item${current && current[0] === card[0] ? ' selected' : ''}" data-pick="${escapeHtml(card[0])}">
          <span>${escapeHtml(card[0])}</span>${pipsHtml(card[3])}
        </button>`).join('');
      if (!results.length) html += `<div class="picker-hint">No commanders match "${escapeHtml(query)}"</div>`;
      if (results.length > MAX_RESULTS) html += `<div class="picker-hint">${results.length - MAX_RESULTS} more, keep typing to narrow it down</div>`;
      list.innerHTML = html;
    }

    function openCommanderPicker(playerId) {
      if (playerDeadState[playerId]) return;
      const picker = document.getElementById(`p${playerId}-picker`);
      const input = picker.querySelector('.picker-search');
      input.value = '';
      renderPickerResults(playerId);
      picker.classList.add('open');
      setTimeout(() => input.focus(), 50);
    }

    function closeCommanderPicker(playerId) {
      document.getElementById(`p${playerId}-picker`).classList.remove('open');
    }

    // Build the commander button, art credit and picker overlay inside each player card
    for (let id = 1; id <= 4; id++) {
      const cardNode = document.getElementById(`p${id}-container`);

      const line = document.createElement('div');
      line.className = 'commander-line';
      line.innerHTML = `
        <button class="commander-pick-btn" type="button"><span class="cp-label">Choose commander</span><span class="cp-caret">▾</span></button>
        <span class="art-credit"></span>
        <div class="tax-control" aria-label="Commander tax">
          <span class="tax-label">Tax</span>
          <button class="tax-btn" type="button" aria-label="Remove commander tax">−</button>
          <span class="tax-val">0</span>
          <button class="tax-btn" type="button" aria-label="Add commander tax">+</button>
        </div>`;
      cardNode.querySelector('.card-header').insertAdjacentElement('afterend', line);
      line.querySelector('.commander-pick-btn').addEventListener('click', () => openCommanderPicker(id));
      const [taxMinus, taxPlus] = line.querySelectorAll('.tax-btn');
      taxMinus.addEventListener('click', () => modifyTax(id, -1));
      taxPlus.addEventListener('click', () => modifyTax(id, 1));
      renderTax(id);

      const picker = document.createElement('div');
      picker.className = 'commander-picker';
      picker.id = `p${id}-picker`;
      picker.innerHTML = `
        <div class="picker-top">
          <input class="picker-search" type="search" placeholder="Search commanders…" autocomplete="off" autocorrect="off" spellcheck="false" />
          <button class="picker-close" type="button">Close</button>
        </div>
        <div class="picker-results"></div>`;
      cardNode.appendChild(picker);

      const input = picker.querySelector('.picker-search');
      input.addEventListener('input', () => renderPickerResults(id));
      input.addEventListener('keydown', e => {
        if (e.key === 'Escape') closeCommanderPicker(id);
        if (e.key === 'Enter') {
          const first = picker.querySelector('.picker-item:not(.land-option)');
          if (first) first.click();
        }
      });
      picker.querySelector('.picker-close').addEventListener('click', () => closeCommanderPicker(id));
      picker.querySelector('.picker-results').addEventListener('click', e => {
        const item = e.target.closest('.picker-item');
        if (!item) return;
        const name = item.getAttribute('data-pick');
        setPlayerCommander(id, name ? commanderByName.get(name) : null);
        closeCommanderPicker(id);
      });
    }

    // Restore each seat's last commander on this device
    try {
      const saved = JSON.parse(localStorage.getItem(COMMANDER_STORE_KEY) || '{}');
      for (const id in saved) {
        if (saved[id] && commanderByName.has(saved[id])) setPlayerCommander(Number(id), commanderByName.get(saved[id]));
      }
    } catch (e) { /* ignore unreadable storage */ }
  </script>
</body>
</html>
